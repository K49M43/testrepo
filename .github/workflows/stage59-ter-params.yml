name: Stage59 TER parameter introspection
on:
  push:
    paths: [".github/workflows/stage59-ter-params.yml"]
jobs:
  params:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: Extract public TER client parameter logic
        run: |
          python - <<'PY'
          import urllib.request,json,re,os
          url='https://www.amfiindia.com/_next/static/chunks/app/ter-of-mf-schemes/page-ba6132da42c6006a.js'
          x=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read().decode()
          out={}
          for key in ['let eg=','let em=','populate-te-rdata-revised','populate-ter-month','let y=','MF_ID','strCat','strType','2026-2027']:
           matches=list(re.finditer(re.escape(key),x))
           out[key]=[x[max(0,m.start()-950):m.end()+2000] for m in matches[:5]]
          os.makedirs('research/stage59',exist_ok=True)
          open('research/stage59/ter_params.json','w').write(json.dumps(out,indent=2))
          PY
      - name: Commit diagnostics
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/stage59
          git diff --cached --quiet || (git commit -m "Capture AMFI TER filter semantics" && git push)
