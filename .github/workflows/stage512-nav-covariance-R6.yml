name: Stage512 R6 audited 36-month NAV covariance
on:
  push:
    paths:
      - 'research/stage512/pipelines/compare_stage58_covariance_R6.py'
      - '.github/workflows/stage512-nav-covariance-R6.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  covariance-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce NAV covariance with source SHA256 and hard QA gates
        run: python research/stage512/pipelines/compare_stage58_covariance_R6.py
      - name: Publish bounded result
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/stage512/data/nav_stage58_comparison_R6.json
          git diff --cached --quiet || (git commit -m 'audit(stage512): publish source-pinned 36-month four-fund covariance R6' && git push)
