name: G5.3 independent candidate evidence audit

on:
  push:
    paths:
      - 'decision/audit_g5_3_independent_candidate_evidence.py'
      - 'decision/audit_g5_2_candidate_register.py'
      - 'research/stage512/2026-11-05/**'
      - 'research/stage512/data/amfi_pilot/**'
      - 'research/stage59/amfi_ter_*.csv'
      - 'research/stage59/amfi_ter_export_diagnostic.json'
      - '.github/workflows/g5-3-independent-audit.yml'
  pull_request:
    paths:
      - 'decision/audit_g5_3_independent_candidate_evidence.py'
      - 'decision/audit_g5_2_candidate_register.py'
      - 'research/stage512/2026-11-05/**'
      - 'research/stage512/data/amfi_pilot/**'
      - 'research/stage59/amfi_ter_*.csv'
      - 'research/stage59/amfi_ter_export_diagnostic.json'
      - '.github/workflows/g5-3-independent-audit.yml'

permissions:
  contents: read

jobs:
  independent-candidate-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned source parsers
        run: python -m pip install openpyxl==3.1.5 pymupdf==1.28.2
      - name: Independently re-extract evidence, verify lineage, and run negative cases
        run: python decision/audit_g5_3_independent_candidate_evidence.py
      - name: Re-run the corrected G5.2 register audit
        run: python decision/audit_g5_2_candidate_register.py --check
