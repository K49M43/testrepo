permissions:
  contents: read
jobs:
  source-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recheck G5 raw-source integrity and decision gates
        run: python research/stage512/2026-11-05/g5_4/audit_g5_4.py
      - name: Recheck candidate NAV date continuity
        run: python research/stage512/2026-11-05/g5_4/audit_g5_candidate_nav_history.py --check
      - name: Recheck G5 exit acceptance and evidence blocks
        run: python research/stage512/2026-11-05/g5_4/audit_g5_exit_acceptance.py --check
      - name: Reconstruct official LIC AMFI history
        run: python research/stage512/pipelines/r9_lic_gsec_official_amfi_history.py
      - name: Reconcile candidate and LIC source coverage
        run: python decision/audit_g6_3_source_inventory.py --check
      - name: Reproduce matched-date Silver NAV comparison
        run: python decision/audit_g6_3_silver_nav_comparison.py --check
      - name: Requalify official CPI source series
        run: python decision/audit_g6_3_cpi_qualification.py --check
      - name: Verify archived RBI T-bill source bytes and identity anchors
        run: python decision/audit_g6_3_rbi_source_capture.py
      - name: Rehash retained RBI 2025-26 T-bill panel
        run: python decision/audit_g6_3_rbi_tbill_window.py research/stage512/2026-11-06/g6_3/rbi_tbill_window_2025_2026
      - name: Verify direct GoI 2036 source pair, conditional settlement arithmetic and nominal cashflows
        run: python decision/audit_g6_3_direct_gsec_2036.py
      - name: Verify November direct GoI primary price and accrual reconciliation
        run: python decision/audit_g6_3_direct_gsec_november_auction.py --check
      - name: Reproduce direct bond and SBI gilt comparison
        run: python decision/compare_g6_3_gilt_routes.py --check
      - name: Reconcile SBI gilt holdings and break-even cashflows
        run: python decision/audit_g6_3_sbi_gilt_holdings.py --check
      - name: Verify SBI gilt accrued interest and after-tax replay
        run: python decision/audit_g6_3_sbi_gilt_valuation.py --check
      - name: Verify exact-date return coverage and candidate inclusion
        run: python decision/audit_g6_3_exact_date_coverage.py --check
      - name: Reproduce WP2 matched NAV and full funding scenarios
        run: python decision/g6_3_wp2_portfolio.py --check
      - name: Reproduce and independently reconcile dated WP2 events
        run: |
          python decision/g6_3_wp2_dated.py --check --trace-dir "$RUNNER_TEMP/g63-wp2"
          python decision/audit_g6_3_wp2_dated.py "$RUNNER_TEMP/g63-wp2"
