name: G4.2 bounded allocation-policy cases
on:
  pull_request:
    paths:
      - '.github/workflows/g4-allocation-policy-cases.yml'
      - 'config/g4_allocation_policy_cases_v1.json'
      - 'config/g4_allocation_policy_cases.schema.v1.json'
      - 'config/g4_action_allocation_policy_v1.json'
      - 'config/investment_mandate_2036.json'
      - 'research/stage512/2026-11-02/cashflow_hurdle_monthly_2026-10_base.csv'
      - 'decision/audit_g4_allocation_policy_cases.py'
      - 'decision/audit_g4_action_allocation_policy.py'
      - 'decision/requirements-g4-validation.txt'
  push:
    paths:
      - '.github/workflows/g4-allocation-policy-cases.yml'
      - 'config/g4_allocation_policy_cases_v1.json'
      - 'config/g4_allocation_policy_cases.schema.v1.json'
      - 'config/g4_action_allocation_policy_v1.json'
      - 'config/investment_mandate_2036.json'
      - 'research/stage512/2026-11-02/cashflow_hurdle_monthly_2026-10_base.csv'
      - 'decision/audit_g4_allocation_policy_cases.py'
      - 'decision/audit_g4_action_allocation_policy.py'
      - 'decision/requirements-g4-validation.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g4-allocation-policy-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned contract-validation dependency
        run: python -m pip install -r decision/requirements-g4-validation.txt
      - name: Revalidate the pinned G4.1 input contract
        run: python decision/audit_g4_action_allocation_policy.py
      - name: Validate G4.2 cases, arithmetic control, source, and negative cases
        run: python decision/audit_g4_allocation_policy_cases.py
