name: Stage512 R7 independent official AMFI NAV risk audit
on:
  push:
    paths:
      - '.github/workflows/stage512-official-nav-R7.yml'
      - 'research/stage512/pipelines/independent_official_NAV_R7.py'
      - 'research/stage512/data/amfi_official_36m/qualification_manifest.json'
      - 'research/stage512/data/amfi_official_36m/official_nav_four_assets.csv'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-official-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate source SHA256, 63 official anchors, dates and published covariance
        run: python research/stage512/pipelines/independent_official_NAV_R7.py
      - name: Commit independent reproducibility report
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/stage512/data/official_nav_independent_R7.json
          git diff --cached --quiet || (git commit -m "audit(stage512): verify official four-fund NAV covariance and regime changes R7" && git push)
