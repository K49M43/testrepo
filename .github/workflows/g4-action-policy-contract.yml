name: G4 action-policy contract audit
on:
  pull_request:
    paths:
      - '.github/workflows/g4-action-policy-contract.yml'
      - 'config/g4_action_allocation_policy_v1.json'
      - 'config/g4_action_allocation_policy.schema.v1.json'
      - 'decision/audit_g4_action_allocation_policy.py'
      - 'decision/requirements-g4-validation.txt'
  push:
    paths:
      - '.github/workflows/g4-action-policy-contract.yml'
      - 'config/g4_action_allocation_policy_v1.json'
      - 'config/g4_action_allocation_policy.schema.v1.json'
      - 'decision/audit_g4_action_allocation_policy.py'
      - 'decision/requirements-g4-validation.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g4-action-policy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned contract-validation dependency
        run: python -m pip install -r decision/requirements-g4-validation.txt
      - name: Validate G4.1 contract, source hashes, and negative cases
        run: python decision/audit_g4_action_allocation_policy.py
