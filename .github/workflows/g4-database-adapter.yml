name: G4.3 database adapter
on:
  pull_request:
    paths:
      - '.github/workflows/g4-database-adapter.yml'
      - 'config/g4_action_allocation_policy*'
      - 'config/g4_allocation_policy_cases*'
      - 'decision/g4_allocation_database_adapter.py'
      - 'decision/audit_g4_allocation_database_adapter.py'
      - 'decision/sprint2_database_pilot.py'
      - 'decision/audit_sprint2_database_pilot.py'
      - 'decision/migrations/001_sprint2_fixture_pilot.sql'
      - 'decision/after_tax_event_ledger.py'
      - 'decision/capital_gain_loss_schedule.py'
      - 'decision/ty2026_27_tax_components.py'
      - 'decision/audit_g4_action_allocation_policy.py'
      - 'decision/audit_g4_allocation_policy_cases.py'
      - 'decision/requirements-g4-validation.txt'
      - 'research/sprint2/fixture_v1/**'
      - 'research/stage512/2026-11-02/cashflow_hurdle_monthly_2026-10_base.csv'
  push:
    paths:
      - '.github/workflows/g4-database-adapter.yml'
      - 'config/g4_action_allocation_policy*'
      - 'config/g4_allocation_policy_cases*'
      - 'decision/g4_allocation_database_adapter.py'
      - 'decision/audit_g4_allocation_database_adapter.py'
      - 'decision/sprint2_database_pilot.py'
      - 'decision/audit_sprint2_database_pilot.py'
      - 'decision/migrations/001_sprint2_fixture_pilot.sql'
      - 'decision/after_tax_event_ledger.py'
      - 'decision/capital_gain_loss_schedule.py'
      - 'decision/ty2026_27_tax_components.py'
      - 'decision/audit_g4_action_allocation_policy.py'
      - 'decision/audit_g4_allocation_policy_cases.py'
      - 'decision/requirements-g4-validation.txt'
      - 'research/sprint2/fixture_v1/**'
      - 'research/stage512/2026-11-02/cashflow_hurdle_monthly_2026-10_base.csv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g4-database-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned contract-validation dependency
        run: python -m pip install -r decision/requirements-g4-validation.txt
      - name: Re-audit the accepted G2 database pilot contract
        run: python decision/audit_sprint2_database_pilot.py
      - name: Audit G4.1, G4.2, and G4.3 adapter/replay boundaries
        run: python decision/audit_g4_allocation_database_adapter.py
